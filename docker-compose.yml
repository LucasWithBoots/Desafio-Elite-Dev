services:
  postgres:
    image: postgres:16-alpine
    container_name: elite-events-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elite_events
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
